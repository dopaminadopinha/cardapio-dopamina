<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a1362">
  <title>Cardápio</title>
  <meta name="description" content="Cardápio do bar, sempre com os preços do dia.">
  <link rel="preconnect" href="https://zpwquzllpdqrpmwniupn.supabase.co" crossorigin>
  <link rel="modulepreload" href="assets/shared.js">
  <link rel="modulepreload" href="assets/config.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body class="menu-page">
  <header class="masthead">
    <p class="eyebrow">Cardápio</p>
    <h1 id="bar-name">&nbsp;</h1>
    <p id="tagline" class="tagline" hidden></p>
  </header>

  <p id="notice" class="notice" role="status" hidden></p>

  <nav class="tabs" aria-label="Seções do cardápio">
    <div id="tabs" class="tabs-track" role="tablist"></div>
  </nav>

  <main id="panel" class="panel" role="tabpanel" aria-live="polite">
    <p class="state">Carregando cardápio…</p>
  </main>

  <aside class="spine" aria-hidden="true"><span id="spine-label"></span></aside>

  <dialog id="photo-dialog" class="photo-sheet" aria-labelledby="photo-name">
    <figure class="photo-card">
      <div class="photo-stage">
        <img id="photo-img" class="photo-img" alt="">
        <button id="photo-prev" class="photo-nav photo-nav-prev" type="button" aria-label="Foto anterior" hidden>‹</button>
        <button id="photo-next" class="photo-nav photo-nav-next" type="button" aria-label="Próxima foto" hidden>›</button>
        <div id="photo-dots" class="photo-dots" aria-hidden="true" hidden></div>
      </div>
      <figcaption class="photo-caption">
        <p id="photo-name" class="photo-name"></p>
        <p id="photo-price" class="photo-price"></p>
        <p id="photo-desc" class="photo-desc" hidden></p>
        <button class="photo-close" type="button" data-close>Fechar</button>
      </figcaption>
    </figure>
  </dialog>

  <footer class="colophon">
    <p id="footer-text" hidden></p>
    <p>Preços em reais · Beba com moderação · Proibido para menores de 18 anos</p>
  </footer>
</body>
</html>
